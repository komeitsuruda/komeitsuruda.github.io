<h1>日記</h1>

<div id="today-entry">
  <h2 id="entry-title">タイトルをここに</h2>
  <p id="entry-date"></p>
  <p id="entry-content">ここに文章を書きます。</p>
</div>

<script>
  // 今日の日付を表示
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('entry-date').textContent = `${yyyy}年${mm}月${dd}日`;
</script>
