<h1>日記</h1>

<div id="today-entry" style="white-space: pre-wrap;">
ここに今日の日記を貼り付けます。

空行で段落、改行もそのまま反映。

写真を入れたい場合は下に<img>を追加
例：
<img src="photo1.jpg" alt="今日の写真" width="300">
</div>

<script>
const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, '0');
const dd = String(today.getDate()).padStart(2, '0');
document.getElementById('today-entry').innerHTML =
  `【${yyyy}年${mm}月${dd}日】\n` + document.getElementById('today-entry').innerHTML;
</script>
