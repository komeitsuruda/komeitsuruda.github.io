<script>
  // 今日の日付を自動表示
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');

  const todayEntryDiv = document.getElementById('today-entry');
  todayEntryDiv.innerHTML = `【${yyyy}年${mm}月${dd}日】\n` + todayEntryDiv.innerHTML;
</script>
